<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloseDose Family Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="nfc.css" />
  <style>
    :root {
      --bg: #0d2433;
      --panel: rgba(255, 255, 255, 0.94);
      --panel-soft: rgba(255, 255, 255, 0.9);
      --accent: #0d8f8a;
      --accent-strong: #0a706c;
      --muted: rgba(15, 46, 68, 0.72);
      --border: rgba(12, 44, 72, 0.18);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.24);
      --radius-lg: 28px;
      --radius-md: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(13, 143, 138, 0.12), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(13, 143, 138, 0.10), transparent 32%),
        radial-gradient(circle at 50% 90%, rgba(13, 143, 138, 0.14), transparent 36%),
        url('./images/bg4k.png');
      background-size: cover;
      background-attachment: fixed;
      color: #0b2136;
      display: flex;
      flex-direction: column;
      padding: clamp(18px, 3vw, 32px);
    }

    .shell {
      width: min(1200px, 100%);
      margin: 0 auto;
      display: grid;
      gap: clamp(18px, 3vw, 28px);
    }

    header {
      background: var(--panel);
      border-radius: var(--radius-lg);
      padding: clamp(18px, 3vw, 28px);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .cappy-badge {
      width: clamp(56px, 7vw, 72px);
      height: clamp(56px, 7vw, 72px);
      border-radius: 50%;
      border: 1px solid var(--border);
      background: white;
      overflow: hidden;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.18);
      flex-shrink: 0;
    }

    .cappy-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .header-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header-meta h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      letter-spacing: 0.02em;
      color: #0a1d2b;
    }

    .header-meta p {
      margin: 0;
      color: var(--muted);
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .pill {
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 10px 16px;
      background: linear-gradient(135deg, rgba(13, 143, 138, 0.14), rgba(13, 143, 138, 0.08));
      color: #0b2136;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 24px rgba(13, 143, 138, 0.18);
    }

    .signout-btn {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: white;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 700;
      color: #0a1d2b;
      box-shadow: 0 10px 18px rgba(0, 0, 0, 0.08);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .signout-btn:hover,
    .signout-btn:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 14px 26px rgba(13, 143, 138, 0.18);
      outline: none;
    }

    main {
      display: grid;
      gap: clamp(16px, 2vw, 24px);
    }

    .panel {
      background: var(--panel-soft);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: clamp(16px, 2vw, 24px);
    }

    .panel h2 {
      margin: 0 0 8px;
      font-size: 1.3rem;
      color: #0a1d2b;
    }

    .panel p {
      margin: 0;
      color: var(--muted);
      font-weight: 600;
    }

    .family-list {
      display: grid;
      gap: clamp(18px, 2vw, 24px);
    }

    .family-card {
      background: white;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: clamp(16px, 2vw, 24px);
      display: grid;
      gap: 18px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
    }

    .family-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .family-header h3 {
      margin: 0;
      font-size: 1.4rem;
      color: #0a1d2b;
    }

    .family-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-weight: 600;
    }

    .member-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .member-card {
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      padding: 14px;
      display: grid;
      gap: 8px;
      background: #fff;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
    }

    .member-photo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(13, 143, 138, 0.08);
      display: grid;
      place-items: center;
      font-weight: 700;
      color: var(--accent-strong);
    }

    .member-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .member-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ghost-btn {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      background: white;
      cursor: pointer;
      font-weight: 600;
      color: #0a1d2b;
    }

    .primary-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(13, 143, 138, 0.24);
    }

    .settings-grid {
      display: grid;
      gap: 14px;
    }

    .settings-row {
      display: grid;
      gap: 10px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 600;
      color: #0a1d2b;
    }

    input, select {
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-family: inherit;
    }

    .inline {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .status {
      font-weight: 600;
      color: var(--muted);
    }

    .status.error { color: #b42318; }
    .status.success { color: #0a706c; }

    .hidden { display: none; }

    details {
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      padding: 12px 14px;
      background: rgba(13, 143, 138, 0.06);
    }

    details summary {
      cursor: pointer;
      font-weight: 700;
      color: #0a1d2b;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="header-left">
        <div class="cappy-badge" aria-hidden="true">
          <img src="cappy/assets/Cappy circle.png" alt="" />
        </div>
        <div class="header-meta">
          <h1>Family Dashboard</h1>
          <p id="dashboardSubhead">Loading your families...</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="pill" id="userEmail">Signed in</span>
        <button class="signout-btn" id="signOutBtn">Sign out</button>
      </div>
    </header>

    <main>
      <section class="panel">
        <h2>Your families</h2>
        <p>Manage members, invites, and care team settings for every family you support.</p>
      </section>

      <section class="family-list" id="familyList"></section>
    </main>
  </div>

  <script type="module">
    import { supabase } from "./auth/supabaseClient.js";

    const { data: sessionData } = await supabase.auth.getSession();
    if (sessionData?.session?.user) {
      const { data: family_id, error } = await supabase.rpc("ensure_active_family_for_current_user");
      console.log({ family_id, error });
    }
  </script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
