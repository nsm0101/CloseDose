<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloseDose Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d2433;
      --panel: rgba(255, 255, 255, 0.96);
      --accent: #0d8f8a;
      --accent-strong: #0a706c;
      --text: #0b2136;
      --muted: rgba(11, 33, 54, 0.65);
      --border: rgba(12, 44, 72, 0.2);
      --shadow: 0 24px 48px rgba(0, 0, 0, 0.26);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, rgba(13, 143, 138, 0.14), transparent 32%),
        radial-gradient(circle at 80% 10%, rgba(13, 143, 138, 0.12), transparent 38%),
        url('./images/bg4k.png');
      background-size: cover;
      background-attachment: fixed;
      padding: 24px;
    }

    .card {
      width: min(520px, 100%);
      background: var(--panel);
      border-radius: var(--radius);
      padding: clamp(20px, 4vw, 32px);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: grid;
      gap: 20px;
    }

    header {
      display: grid;
      gap: 6px;
    }

    .cappy-badge {
      width: clamp(64px, 12vw, 80px);
      height: clamp(64px, 12vw, 80px);
      border-radius: 50%;
      border: 1px solid var(--border);
      background: white;
      overflow: hidden;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.2);
    }

    .cappy-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2rem);
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-weight: 600;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .tab-button {
      border: 1px solid var(--border);
      background: white;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text);
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .tab-button[aria-pressed="true"] {
      background: linear-gradient(135deg, rgba(13, 143, 138, 0.16), rgba(13, 143, 138, 0.08));
      border-color: rgba(13, 143, 138, 0.5);
      color: var(--accent-strong);
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 600;
    }

    input {
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 12px 14px;
      font-family: inherit;
      font-size: 1rem;
    }

    button[type="submit"] {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      box-shadow: 0 12px 24px rgba(13, 143, 138, 0.28);
    }

    .status {
      min-height: 22px;
      font-weight: 600;
      color: var(--muted);
    }

    .status.error { color: #b42318; }
    .status.success { color: #0a706c; }

    .note {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .hidden { display: none; }
  </style>
  <link rel="stylesheet" href="nfc.css" />
</head>
<body>
  <div class="card">
    <header>
      <div class="cappy-badge" aria-hidden="true">
        <img src="cappy/assets/Cappy circle.png" alt="" />
      </div>
      <h1>Welcome back to CloseDose</h1>
      <p>Sign in or create an account to access your family dashboard.</p>
    </header>

    <div class="tabs" role="tablist" aria-label="Authentication options">
      <button class="tab-button" type="button" data-target="login" aria-pressed="true">Log in</button>
      <button class="tab-button" type="button" data-target="register" aria-pressed="false">Register</button>
      <button class="tab-button" type="button" data-target="reset" aria-pressed="false">Reset</button>
    </div>

    <section id="login" role="tabpanel">
      <form id="loginForm">
        <label>
          Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          Password
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Log in</button>
        <div class="status" id="loginStatus"></div>
      </form>
    </section>

    <section id="register" role="tabpanel" class="hidden">
      <form id="registerForm">
        <label>
          Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          Password
          <input type="password" name="password" autocomplete="new-password" minlength="6" required>
        </label>
        <button type="submit">Create account</button>
        <div class="status" id="registerStatus"></div>
        <p class="note">We may ask you to confirm your email before you can sign in.</p>
      </form>
    </section>

    <section id="reset" role="tabpanel" class="hidden">
      <form id="resetForm">
        <label>
          Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <button type="submit">Send reset email</button>
        <div class="status" id="resetStatus"></div>
      </form>
    </section>
  </div>

  <script type="module">
    import { supabase } from "./auth/supabaseClient.js";

    const ensureActiveFamilyForCurrentUser = async (options = {}) => {
      const { retries = 2, delayMs = 500 } = options;
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      let lastError = null;

      for (let attempt = 0; attempt <= retries; attempt += 1) {
        const { data: familyId, error } = await supabase.rpc("ensure_active_family_for_current_user");
        if (!error && familyId) {
          return familyId;
        }
        if (error) {
          lastError = error;
          console.error("family ensure failed", error);
        }
        if (attempt < retries) {
          await sleep(delayMs);
        }
      }

      if (lastError) {
        console.warn("family ensure did not resolve after retries");
      }
      return null;
    };

    const redirectParam = new URLSearchParams(window.location.search).get("redirect");

    const sanitizeRedirect = (value) => {
      if (!value || !value.startsWith("/")) return "/dashboard.html";
      if (value.includes("http") || value.includes("//") || value.includes("\\")) return "/dashboard.html";
      return value;
    };

    const redirectTarget = sanitizeRedirect(redirectParam);

    const resolveRedirectTarget = () => {
      const pendingInvite = localStorage.getItem("pending_invite_token");
      if (pendingInvite) {
        return `/cappy/join.html?token=${encodeURIComponent(pendingInvite)}`;
      }
      return redirectTarget;
    };

    const tabs = document.querySelectorAll(".tab-button");
    const panels = document.querySelectorAll("[role='tabpanel']");

    const setStatus = (element, message, type = "") => {
      if (!element) return;
      element.textContent = message;
      element.classList.remove("error", "success");
      if (type) {
        element.classList.add(type);
      }
    };

    tabs.forEach((button) => {
      button.addEventListener("click", () => {
        const target = button.dataset.target;
        tabs.forEach((tab) => tab.setAttribute("aria-pressed", String(tab === button)));
        panels.forEach((panel) => {
          panel.classList.toggle("hidden", panel.id !== target);
        });
      });
    });

    document.getElementById("loginForm")?.addEventListener("submit", async (event) => {
      event.preventDefault();
      const status = document.getElementById("loginStatus");
      setStatus(status, "Signing you in...");

      const formData = new FormData(event.target);
      const email = String(formData.get("email") || "").trim();
      const password = String(formData.get("password") || "");

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        setStatus(status, error.message, "error");
        return;
      }

      const resolvedRedirect = resolveRedirectTarget();
      const familyId = await ensureActiveFamilyForCurrentUser();
      if (!familyId && !resolvedRedirect.startsWith("/cappy/")) {
        setStatus(status, "Signed in! We are still setting up your family.", "success");
      } else {
        setStatus(status, "Success! Redirecting...", "success");
      }
      window.location.href = resolvedRedirect;
    });

    document.getElementById("registerForm")?.addEventListener("submit", async (event) => {
      event.preventDefault();
      const status = document.getElementById("registerStatus");
      setStatus(status, "Creating your account...");

      const formData = new FormData(event.target);
      const email = String(formData.get("email") || "").trim();
      const password = String(formData.get("password") || "");

      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) {
        setStatus(status, error.message, "error");
        return;
      }

      if (data?.session) {
        const resolvedRedirect = resolveRedirectTarget();
        const familyId = await ensureActiveFamilyForCurrentUser();
        if (!familyId && !resolvedRedirect.startsWith("/cappy/")) {
          setStatus(status, "Account created! We are still setting up your family.", "success");
        } else {
          setStatus(status, "Account created! Redirecting...", "success");
        }
        window.location.href = resolvedRedirect;
        return;
      }

      setStatus(status, "Check your email for a confirmation link.", "success");
    });

    document.getElementById("resetForm")?.addEventListener("submit", async (event) => {
      event.preventDefault();
      const status = document.getElementById("resetStatus");
      setStatus(status, "Sending reset email...");

      const formData = new FormData(event.target);
      const email = String(formData.get("email") || "").trim();

      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}/login.html`,
      });

      if (error) {
        setStatus(status, error.message, "error");
        return;
      }

      setStatus(status, "Reset email sent. Check your inbox.", "success");
    });
  </script>
  <script src="nfc.js" defer></script>
</body>
</html>
