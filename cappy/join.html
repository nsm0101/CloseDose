<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Family • CloseDose</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d2433;
      --panel: rgba(255, 255, 255, 0.96);
      --accent: #0d8f8a;
      --accent-strong: #0a706c;
      --text: #0b2136;
      --muted: rgba(11, 33, 54, 0.65);
      --border: rgba(12, 44, 72, 0.2);
      --shadow: 0 24px 48px rgba(0, 0, 0, 0.26);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 20%, rgba(13, 143, 138, 0.14), transparent 32%),
        radial-gradient(circle at 80% 10%, rgba(13, 143, 138, 0.12), transparent 38%),
        url('../images/bg4k.png');
      background-size: cover;
      background-attachment: fixed;
      padding: 24px;
    }

    .card {
      width: min(520px, 100%);
      background: var(--panel);
      border-radius: var(--radius);
      padding: clamp(20px, 4vw, 32px);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: grid;
      gap: 18px;
    }

    header {
      display: grid;
      gap: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2rem);
    }

    p {
      margin: 0;
      color: var(--muted);
      font-weight: 600;
    }

    .status {
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: white;
      font-weight: 600;
      color: var(--muted);
      display: grid;
      gap: 8px;
    }

    .status.error { color: #b42318; }
    .status.success { color: #0a706c; }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      box-shadow: 0 12px 24px rgba(13, 143, 138, 0.28);
    }

    button[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    details {
      font-size: 0.9rem;
      color: var(--muted);
      background: rgba(13, 143, 138, 0.05);
      border-radius: 12px;
      padding: 10px 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <h1>Join a CloseDose family</h1>
      <p>Accept your invite to access family dosing plans.</p>
    </header>

    <div class="status" id="joinStatus" aria-live="polite"></div>
    <details id="errorDetails" hidden>
      <summary>Technical details</summary>
      <pre id="errorMessage"></pre>
    </details>
    <button type="button" id="acceptInviteBtn" hidden>Accept Invite</button>
  </div>

  <script type="module" src="join.js"></script>
</body>
</html>
