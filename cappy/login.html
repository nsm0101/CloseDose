<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cappy Login</title>
  <style>
    :root {
      --brand-green: #24a687;
      --text-body: #1f2a37;
      --muted: #6b7280;
      --surface: #ffffff;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: var(--text-body);
    }

    .page-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      max-width: 420px;
      width: 100%;
      background: var(--surface);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      color: var(--brand-green);
      margin-bottom: 4px;
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .mode-toggle button {
      border: 1px solid var(--border);
      background: #f9fafb;
      color: var(--text-body);
      padding: 10px 12px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
    }

    .mode-toggle button.active {
      background: var(--brand-green);
      color: #fff;
      border-color: var(--brand-green);
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--muted);
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 14px;
      margin-bottom: 14px;
    }

    .hidden {
      display: none;
    }

    .primary-btn {
      width: 100%;
      border: none;
      background: var(--brand-green);
      color: #fff;
      padding: 12px 16px;
      border-radius: 999px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
    }

    .primary-btn:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }

    .status.error {
      color: #b91c1c;
    }

    .footer-note {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="page-shell">
    <div class="auth-card">
      <div class="brand">Cappy</div>
      <p class="subtitle">Sign in to manage your family and dosing history.</p>

      <div class="mode-toggle" role="tablist">
        <button type="button" data-mode="login" class="active">Log in</button>
        <button type="button" data-mode="register">Create account</button>
      </div>

      <form id="auth-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />

        <div id="confirm-wrapper" class="hidden">
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" type="password" autocomplete="new-password" />
        </div>

        <button id="submit-btn" class="primary-btn" type="submit">Log in</button>
      </form>

      <div id="status" class="status"></div>
      <div class="footer-note">We’ll redirect you back after authentication.</div>
    </div>
  </div>

  <script type="module">
    import { supabase } from "./supabase.js";

    const form = document.getElementById("auth-form");
    const status = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");
    const confirmWrapper = document.getElementById("confirm-wrapper");
    const confirmPasswordInput = document.getElementById("confirm-password");
    const modeButtons = document.querySelectorAll("[data-mode]");

    const urlParams = new URLSearchParams(window.location.search);
    const rawRedirect = urlParams.get("redirect");
    let redirectTarget = "/dashboard.html";
    if (rawRedirect) {
      try {
        redirectTarget = decodeURIComponent(rawRedirect);
      } catch (error) {
        redirectTarget = rawRedirect;
      }
    }

    let activeMode = "login";

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function setMode(mode) {
      activeMode = mode;
      modeButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.mode === mode);
      });

      confirmWrapper.classList.toggle("hidden", mode !== "register");
      confirmPasswordInput.required = mode === "register";
      confirmPasswordInput.value = "";
      submitBtn.textContent = mode === "register" ? "Create account" : "Log in";
      setStatus("");
    }

    async function redirectIfSession() {
      const { data } = await supabase.auth.getSession();
      if (data?.session) {
        window.location.href = redirectTarget;
      }
    }

    modeButtons.forEach((button) => {
      button.addEventListener("click", () => setMode(button.dataset.mode));
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("");
      submitBtn.disabled = true;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        if (activeMode === "register") {
          const confirmPassword = confirmPasswordInput.value;
          if (password !== confirmPassword) {
            throw new Error("Passwords do not match.");
          }
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
          });
          if (error) {
            throw error;
          }
          if (data?.session) {
            window.location.href = redirectTarget;
            return;
          }
          setStatus("Check your email to confirm your account.");
        } else {
          const { error } = await supabase.auth.signInWithPassword({
            email,
            password,
          });
          if (error) {
            throw error;
          }
          window.location.href = redirectTarget;
        }
      } catch (error) {
        setStatus(error.message || "Something went wrong.", true);
      } finally {
        submitBtn.disabled = false;
      }
    });

    setMode(activeMode);
    redirectIfSession();
  </script>
</body>

</html>
