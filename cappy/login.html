<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cappy! Login</title>
    <style>
      :root {
        --brand: #24a687;
        --ink: #1f2a37;
        --muted: #6b7280;
        --surface: #ffffff;
        --border: #d1d5db;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: var(--ink);
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: min(460px, 100%);
        background: var(--surface);
        border-radius: 22px;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.16);
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .logo img {
        width: 48px;
        height: 48px;
      }

      h1 {
        margin: 0;
        font-size: 1.4rem;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 12px;
      }

      label {
        font-weight: 600;
        font-size: 0.95rem;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        font-size: 1rem;
      }

      input:focus {
        outline: 3px solid rgba(36, 166, 135, 0.2);
        border-color: var(--brand);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 10px 18px;
        font-weight: 700;
        cursor: pointer;
        font-size: 0.95rem;
      }

      .primary {
        background: var(--brand);
        color: #ffffff;
      }

      .secondary {
        background: #e7f7f2;
        color: var(--brand);
      }

      .link-btn {
        background: transparent;
        color: var(--muted);
        text-decoration: underline;
        padding: 0;
        font-weight: 600;
      }

      #auth-message {
        margin-top: 12px;
        font-weight: 600;
      }

      .message-error {
        color: var(--danger);
      }

      .message-success {
        color: var(--brand);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <div class="logo">
          <img src="/images/CAPPY.png" alt="Cappy logo" />
          <div>
            <h1>Sign in to Cappy!</h1>
            <p>Access your medication manager with email + password.</p>
          </div>
        </div>
        <form id="auth-form">
          <div>
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" autocomplete="email" required />
          </div>
          <div>
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              name="password"
              autocomplete="current-password"
              required
              minlength="6" />
          </div>
          <div class="actions">
            <button type="submit" class="primary">Sign In</button>
            <button type="button" class="secondary" id="sign-up-btn">Register</button>
            <button type="button" class="link-btn" id="forgot-password-btn">Forgot password?</button>
          </div>
        </form>
        <p id="auth-message" aria-live="polite"></p>
      </div>
    </div>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      const supabaseUrl = "https://tfmpgxwzgdzndbdzsftx.supabase.co";
      const supabaseAnonKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRmbXBneHd6Z2R6bmRiZHpzZnR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQxNjg0MDcsImV4cCI6MjA3OTc0NDQwN30.X5f5YulGHxjJDFX2i7T3vDZXD3Gt9MY8SyvFybTHCKc";

      const supabase = createClient(supabaseUrl, supabaseAnonKey);
      const form = document.getElementById("auth-form");
      const message = document.getElementById("auth-message");
      const signUpBtn = document.getElementById("sign-up-btn");
      const forgotBtn = document.getElementById("forgot-password-btn");

      const setMessage = (text, isError = false) => {
        if (!message) return;
        message.textContent = text;
        message.classList.toggle("message-error", isError);
        message.classList.toggle("message-success", !isError);
      };

      const getRedirectTarget = () => {
        const params = new URLSearchParams(window.location.search);
        return params.get("redirect") || "/dashboard.html";
      };

      form?.addEventListener("submit", async (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const email = String(formData.get("email") || "").trim();
        const password = String(formData.get("password") || "").trim();

        if (!email || !password) {
          setMessage("Enter your email and password.", true);
          return;
        }

        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          setMessage(error.message, true);
          return;
        }

        setMessage("Signed in successfully. Redirecting…");
        window.location.href = getRedirectTarget();
      });

      signUpBtn?.addEventListener("click", async () => {
        const formData = new FormData(form);
        const email = String(formData.get("email") || "").trim();
        const password = String(formData.get("password") || "").trim();

        if (!email || !password) {
          setMessage("Enter your email and password to register.", true);
          return;
        }

        const { error } = await supabase.auth.signUp({ email, password });
        if (error) {
          setMessage(error.message, true);
          return;
        }

        const { data: sessionData } = await supabase.auth.getSession();
        if (sessionData?.session) {
          setMessage("Account created. Redirecting…");
          window.location.href = getRedirectTarget();
        } else {
          setMessage("Check your email to confirm your account.");
        }
      });

      forgotBtn?.addEventListener("click", async () => {
        const formData = new FormData(form);
        const email = String(formData.get("email") || "").trim();
        if (!email) {
          setMessage("Enter your email to reset your password.", true);
          return;
        }

        const { error } = await supabase.auth.resetPasswordForEmail(email);
        if (error) {
          setMessage(error.message, true);
        } else {
          setMessage("Password reset email sent.");
        }
      });
    </script>
  </body>
</html>
