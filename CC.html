<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PALS Multi-Timer Cardiac Arrest Webapp</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; margin: 0; padding: 0; }
    .container { max-width: 800px; margin: auto; padding: 20px; }
    h1 { color: #0176c9; margin-bottom: 8px; }
    #timers { display: flex; flex-direction: column; gap: 16px; }
    .timer-row { border-radius: 6px; display: flex; align-items: center; padding: 10px; margin-bottom: 2px; transition: background 0.2s; }
    .red { border-left: 8px solid #e53935; }
    .orange { border-left: 8px solid #ff9800; }
    .grey { border-left: 8px solid #9e9e9e; }
    .timer-controls { margin-left: auto; display: flex; gap: 6px; }
    .hidden { display: none; }
    .bold { font-weight: bold; }
    .accent-color { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #ccc; margin: 2px; cursor: pointer; display: inline-block; }
    .footer { position: fixed; bottom: 6px; left: 0; right: 0; background: #fff; display: flex; justify-content: center; gap: 10px; padding: 8px; box-shadow: 0 -2px 8px #e8e8e8; }
    #addTimerBtn { background: #0176c9; color: #fff; border: none; border-radius: 5px; padding: 8px 14px; cursor: pointer; }
    .dose-log { background: #f3f4f7; padding: 6px 10px; border-radius: 6px; margin-top: 6px; }
    .input-label { border: none; background: #fafafa; border-radius: 3px; font-size: 1em; padding: 4px 8px; width: 120px; margin-right: 8px; }
    .collapse { background: #f2f3f6; cursor: pointer; padding: 0 8px; border-radius: 4px; margin-right: 8px; }
    .popup { position: fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.25); display:flex; align-items:center; justify-content:center; z-index:10; }
    .popup-content { background:#fff; border-radius:10px; padding:28px; box-shadow:0 0 16px #bbb; min-width:320px; max-width:90vw; }
    .color-picker { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .visual-done { font-weight: bold; color: #e53935; } /* Show when CPR timer expires */
    .pulse-check { font-size: 1.1em; color: #e53935; margin-left: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>PALS Cardiac Arrest Multi-Timer Webapp</h1>
    <div id="timers"></div>
    <button id="addTimerBtn">+ Add Timer</button>
    <div id="doseLog" class="dose-log hidden"></div>
  </div>

  <!-- Timer Popup -->
  <div id="timerPopup" class="popup hidden">
    <div class="popup-content">
      <div><b>New Timer Setup</b></div>
      <div style="margin-top:8px;">
        <label>Timer Name:</label> <input type="text" id="timerNameInput" maxlength="24" style="width:150px;">
      </div>
      <div style="margin-top:8px;">
        <label>Type:</label>
        <select id="timerTypeOption">
          <option value="countUp">Count Up</option>
          <option value="countDown">Count Down</option>
        </select>
      </div>
      <div style="margin-top:8px;">
        <label>Minutes:</label> <input type="number" min="1" max="60" id="timerMinutesInput" value="2" style="width:60px;">
      </div>
      <div style="margin-top:8px;">
        <button id="colorToggleBtn" onclick="toggleColorPicker()">Show Color Picker</button>
        <div id="colorPicker" class="color-picker hidden"></div>
      </div>
      <div style="margin-top:18px;">
        <button onclick="createNewTimer()">Create Timer</button>
        <button onclick="closePopup()">Cancel</button>
      </div>
    </div>
  </div>
  <script>
    // Accent color palette for 8 colors
    const accentColors = [
      {name:'Red',val:'#e53935',class:'red'},
      {name:'Orange',val:'#ff9800',class:'orange'},
      {name:'Grey',val:'#9e9e9e',class:'grey'},
      {name:'Blue',val:'#0176c9',class:'blue'},
      {name:'Green',val:'#43a047',class:'green'},
      {name:'Purple',val:'#7e57c2',class:'purple'},
      {name:'Yellow',val:'#fdd835',class:'yellow'},
      {name:'Pink',val:'#ec407a',class:'pink'},
    ];
    // CPR/Pulse Check logic
    let cprIntervals = 0;
    const timers = [
      {
        label: 'CPR', editable: true, accent: 'red',
        collapsed: false, type: 'countDown', total: 120,
        remaining: 120, interval: null, doses: [], log: [], ref: null,
        id: 'CPR', default: true
      },
      {
        label: 'Epinephrine', editable: true, accent: 'orange',
        collapsed: false, type: 'countUp', total: 0,
        remaining: 0, interval: null, doses: [], log: [], ref: null,
        id: 'Epi', default: true
      }
    ];
    let timerIdNum = 0;
    let lastPulseTime = null;
    let colorPickerSelected = 'grey';
    // Render Timers in main UI, collapsed/expanded
    function renderTimers() {
      const container = document.getElementById('timers');
      container.innerHTML = '';
      timers.forEach((T, idx) => {
        const collapsed = T.collapsed;
        let accentClass = accentColors.find(c => c.class === T.accent)?.class ?? 'grey';
        const timerRow = document.createElement('div');
        timerRow.className = `timer-row ${accentClass}`;
        // collapse button
        const collapseBtn = document.createElement('span');
        collapseBtn.textContent = collapsed ? '▶' : '▼';
        collapseBtn.className = 'collapse';
        collapseBtn.onclick = () => { T.collapsed = !T.collapsed; renderTimers(); };
        timerRow.appendChild(collapseBtn);
        // editable label
        const label = document.createElement('input');
        label.value = T.label;
        label.className = 'bold input-label';
        label.disabled = !T.editable;
        label.onchange = e => { T.label = e.target.value; renderTimers(); };
        timerRow.appendChild(label);
        // timer display
        let timerDisplay = document.createElement('span');
        timerDisplay.style.fontWeight = collapsed ? 'bold':'normal';

        // Timer logic/collapse content
        if (collapsed) {
          timerDisplay.textContent = `${formatTime(T.remaining, T.type)} `;
          timerRow.appendChild(timerDisplay);
          // Last dose
          const lastDose = T.doses.length ? Math.floor((Date.now()-T.doses[T.doses.length-1])/60000)+'m ago':'Never';
          const lastDoseDisp = document.createElement('span');
          lastDoseDisp.innerHTML = `<b>Last dose:</b> ${lastDose}`;
          lastDoseDisp.style.marginLeft = '12px';
          timerRow.appendChild(lastDoseDisp);

          // Count of doses
          const doseCount = document.createElement('span');
          doseCount.innerHTML = `<b>Doses:</b> ${T.doses.length}`;
          doseCount.style.marginLeft = '12px';
          timerRow.appendChild(doseCount);

          // Log Dose
          const logBtn = document.createElement('button');
          logBtn.textContent = 'Log Dose';
          logBtn.onclick = () => { logDose(idx); };
          logBtn.style.marginLeft = '16px';
          timerRow.appendChild(logBtn);

          // Collapse to header/footer row only
        } else {
          // Main expanded timer UI
          timerDisplay.innerHTML = `<span>${T.label}</span> <span class="bold">${formatTime(T.remaining,T.type)}</span>`;
          timerRow.appendChild(timerDisplay);
          // Controls & Actions
          const controls = document.createElement('div');
          controls.className = 'timer-controls';
          // CPR controls
          if (T.label.toLowerCase() === 'cpr') {
            if (T.interval) {
              controls.innerHTML += `<span class="visual-done hidden" id="done-${T.id}">Rhythm/Pulse Check!</span>`;
            } else {
              controls.innerHTML += `<button onclick="startCprTimer(${idx})">Start CPR</button>`;
            }
          } else if (T.label.toLowerCase()==='epinephrine') {
            controls.innerHTML += `<button onclick="logDose(${idx})">Log Dose</button>`;
          } else {
            controls.innerHTML += `<button onclick="startCustomTimer(${idx})">Start Timer</button>
            <button onclick="logDose(${idx})">Log Dose</button>
            <button onclick="changeAccent(${idx})">Accent</button>`;
          }
          timerRow.appendChild(controls);
          // Dose log below timer
          if (T.doses.length){
            const doseLog = document.createElement('div');
            doseLog.className = 'dose-log';
            doseLog.innerHTML = `<b>Dose Log:</b> `+T.doses.map(d=>
              `${new Date(d).toLocaleString()}`).join('<br>');
            timerRow.appendChild(doseLog);
          }
        }
        container.appendChild(timerRow);
      });
    }
    // Formatting timer
    function formatTime(s,type){
      if(type==='countUp') s = s;
      let min = Math.floor(s/60), sec=s%60;
      return `${min}:${sec<10?'0'+sec:sec}`;
    }
    // CPR specific logic
    function startCprTimer(idx){
      let T = timers[idx];
      if (T.interval) return;
      T.remaining = 120;
      let pulseChecks = cprIntervals;
      T.interval = setInterval(()=>{
        T.remaining--;
        renderTimers();
        if(T.remaining<=0){
          clearInterval(T.interval);
          T.interval=null;
          cprIntervals++;
          document.getElementById(`done-${T.id}`)?.classList.remove('hidden');
          setTimeout(()=>{
            document.getElementById(`done-${T.id}`)?.classList.add('hidden');
            renderTimers();
          },4000);
          // Prompt for Epi every 2nd cycle
          if(cprIntervals%2===0){
            promptEpiDose();
          }
        }
      },1000);
      renderTimers();
    }
    function promptEpiDose(){
      const epiTimer = timers.find(t=>t.label.toLowerCase().includes('epinephrine'));
      if (epiTimer) {
        let lastEpi = epiTimer.doses.length?epiTimer.doses[epiTimer.doses.length-1]:0;
        let lastCprDone = Date.now();
        setTimeout(()=>{
          if (epiTimer.doses.length===0 || (Date.now()-epiTimer.doses[epiTimer.doses.length-1])>30000) {
            alert('Consider Code-dose Epinephrine!');
          }
        }, 30000);  // 30 seconds after CPR timer ends
      }
    }
    // Dose logging
    function logDose(idx){
      let T = timers[idx];
      T.doses.push(Date.now());
      T.log.push({timestamp:Date.now()});
      if(T.type==='countUp'){T.remaining=0;}
      renderTimers();
      showDoseLog(T);
    }
    function showDoseLog(T){
      const logBox = document.getElementById('doseLog');
      logBox.innerHTML = `<b>Doses for ${T.label}</b><br>`+T.doses.map(ts=>new Date(ts).toLocaleString()).join('<br>');
      logBox.classList.remove('hidden');
      setTimeout(()=>{logBox.classList.add('hidden');},3500);
    }
    // Custom timer logic
    function startCustomTimer(idx){
      let T = timers[idx];
      if(T.interval)return;
      T.remaining = T.type==='countDown'?T.total:0;
      T.interval = setInterval(()=>{
        if(T.type==='countDown'){
          T.remaining--;
          if(T.remaining<=0){
            clearInterval(T.interval); T.interval=null;
          }
        } else {
          T.remaining++;
        }
        renderTimers();
      },1000);
      renderTimers();
    }
    // Accent color picker dialog
    function changeAccent(idx){
      showColorPicker(idx);
    }
    function showColorPicker(idx){
      colorPickerSelected = timers[idx].accent;
      document.getElementById('colorPicker').classList.remove('hidden');
      renderColorPicker(idx);
    }
    function renderColorPicker(idx){
      let picker = document.getElementById('colorPicker');
      picker.innerHTML = '';
      accentColors.forEach(accent=>{
        let btn = document.createElement('span');
        btn.className = 'accent-color';
        btn.style.background = accent.val;
        btn.onclick = ()=>{
          timers[idx].accent = accent.class;
          document.getElementById('colorPicker').classList.add('hidden');
          renderTimers();
        };
        picker.appendChild(btn);
      });
    }
    function toggleColorPicker(){
      document.getElementById('colorPicker').classList.toggle('hidden');
    }
    // Timer popup overlay
    document.getElementById('addTimerBtn').onclick = ()=>openTimerPopup();
    function openTimerPopup(){
      document.getElementById('timerPopup').classList.remove('hidden');
      document.getElementById('timerNameInput').value = '';
      document.getElementById('timerTypeOption').value = 'countUp';
      document.getElementById('timerMinutesInput').value = 2;
      document.getElementById('colorPicker').classList.add('hidden');
      colorPickerSelected = 'grey';
      renderColorPicker(-1);
    }
    function closePopup(){
      document.getElementById('timerPopup').classList.add('hidden');
    }
    function createNewTimer(){
      let name = document.getElementById('timerNameInput').value || 'Custom';
      let type = document.getElementById('timerTypeOption').value;
      let mins = parseInt(document.getElementById('timerMinutesInput').value)||2;
      let accent = colorPickerSelected || 'grey';
      timers.push({
        label: name, editable: true, accent,
        collapsed: true, type, total: mins*60, remaining: type==='countDown'?mins*60:0,
        interval: null, doses: [], log: [], id: 'custom-'+(++timerIdNum), default: false
      });
      closePopup();
      renderTimers();
    }
    // Initial colorPicker setup
    renderColorPicker(-1);
    // Show timers at start
    renderTimers();
  </script>
</body>
</html>
