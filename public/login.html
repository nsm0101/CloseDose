<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="images/LOGO-WC.png">
  <link rel="apple-touch-icon" href="images/LOGO-WC.png">
  <link rel="stylesheet" href="global.css" />

  <title>CloseDose Login</title>
  <script>(function(){var t=localStorage.getItem("cd-theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
  <div class="wrap">
    
    <header>
      <img src="images/Logomark-WC.png" alt="CloseDose" class="header-wordmark" />
      <button class="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="siteMenu" aria-label="Open menu">
        <span class="label">Menu</span>
        <span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
    </header>
    <main>
      <div class="layout">
        
  <div class="card">
    

    <div class="tabs" role="tablist" aria-label="Authentication options">
      <button class="tab-button" type="button" data-target="login" aria-pressed="true">Log in</button>
      <button class="tab-button" type="button" data-target="register" aria-pressed="false">Register</button>
      <button class="tab-button" type="button" data-target="reset" aria-pressed="false">Reset</button>
    </div>

    <section id="login" role="tabpanel">
      <form id="loginForm">
        <label>
          Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          Password
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Log in</button>
        <div class="status" id="loginStatus"></div>
      </form>
    </section>

    <section id="register" role="tabpanel" class="hidden">
      <form id="registerForm">
        <label>
          Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
          Password
          <input type="password" name="password" autocomplete="new-password" minlength="6" required>
        </label>
        <button type="submit">Create account</button>
        <div class="status" id="registerStatus"></div>
        <p class="note">We may ask you to confirm your email before you can sign in.</p>
      </form>
    </section>

    <section id="reset" role="tabpanel" class="hidden">
      <form id="resetForm">
        <label>
          Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <button type="submit">Send reset email</button>
        <div class="status" id="resetStatus"></div>
      </form>
    </section>
  </div>

  <script type="module">
    import { supabase } from "./auth/supabaseClient.js";

    const ensureActiveFamilyForCurrentUser = async (options = {}) => {
      const { retries = 2, delayMs = 500 } = options;
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      let lastError = null;

      for (let attempt = 0; attempt <= retries; attempt += 1) {
        const { data: familyId, error } = await supabase.rpc("ensure_active_family_for_current_user");
        if (!error && familyId) {
          return familyId;
        }
        if (error) {
          lastError = error;
          console.error("family ensure failed", error);
        }
        if (attempt < retries) {
          await sleep(delayMs);
        }
      }

      if (lastError) {
        console.warn("family ensure did not resolve after retries");
      }
      return null;
    };

    const redirectParam = new URLSearchParams(window.location.search).get("redirect");

    const sanitizeRedirect = (value) => {
      if (!value || !value.startsWith("/")) return "/dashboard.html";
      if (value.includes("http") || value.includes("//") || value.includes("\\")) return "/dashboard.html";
      return value;
    };

    const redirectTarget = sanitizeRedirect(redirectParam);

    const resolveRedirectTarget = () => {
      const pendingInvite = localStorage.getItem("pending_invite_token");
      if (pendingInvite) {
        return `/cappy/join.html?token=${encodeURIComponent(pendingInvite)}`;
      }
      return redirectTarget;
    };

    const tabs = document.querySelectorAll(".tab-button");
    const panels = document.querySelectorAll("[role='tabpanel']");

    const setStatus = (element, message, type = "") => {
      if (!element) return;
      element.textContent = message;
      element.classList.remove("error", "success");
      if (type) {
        element.classList.add(type);
      }
    };

    tabs.forEach((button) => {
      button.addEventListener("click", () => {
        const target = button.dataset.target;
        tabs.forEach((tab) => tab.setAttribute("aria-pressed", String(tab === button)));
        panels.forEach((panel) => {
          panel.classList.toggle("hidden", panel.id !== target);
        });
      });
    });

    document.getElementById("loginForm")?.addEventListener("submit", async (event) => {
      event.preventDefault();
      const status = document.getElementById("loginStatus");
      setStatus(status, "Signing you in...");

      const formData = new FormData(event.target);
      const email = String(formData.get("email") || "").trim();
      const password = String(formData.get("password") || "");

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        setStatus(status, error.message, "error");
        return;
      }

      const resolvedRedirect = resolveRedirectTarget();
      const familyId = await ensureActiveFamilyForCurrentUser();
      if (!familyId && !resolvedRedirect.startsWith("/cappy/")) {
        setStatus(status, "Signed in! We are still setting up your family.", "success");
      } else {
        setStatus(status, "Success! Redirecting...", "success");
      }
      window.location.href = resolvedRedirect;
    });

    document.getElementById("registerForm")?.addEventListener("submit", async (event) => {
      event.preventDefault();
      const status = document.getElementById("registerStatus");
      setStatus(status, "Creating your account...");

      const formData = new FormData(event.target);
      const email = String(formData.get("email") || "").trim();
      const password = String(formData.get("password") || "");

      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) {
        setStatus(status, error.message, "error");
        return;
      }

      if (data?.session) {
        const resolvedRedirect = resolveRedirectTarget();
        const familyId = await ensureActiveFamilyForCurrentUser();
        if (!familyId && !resolvedRedirect.startsWith("/cappy/")) {
          setStatus(status, "Account created! We are still setting up your family.", "success");
        } else {
          setStatus(status, "Account created! Redirecting...", "success");
        }
        window.location.href = resolvedRedirect;
        return;
      }

      setStatus(status, "Check your email for a confirmation link.", "success");
    });

    document.getElementById("resetForm")?.addEventListener("submit", async (event) => {
      event.preventDefault();
      const status = document.getElementById("resetStatus");
      setStatus(status, "Sending reset email...");

      const formData = new FormData(event.target);
      const email = String(formData.get("email") || "").trim();

      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}/login.html`,
      });

      if (error) {
        setStatus(status, error.message, "error");
        return;
      }

      setStatus(status, "Reset email sent. Check your inbox.", "success");
    });
  </script>
  <script src="nfc.js" defer></script>

      </div>
    </main>
  </div>
  
  <footer class="cd-footer">
    <p class="cd-copy">2026 CloseDose. All rights reserved.</p>
    <nav class="cd-legal cd-legal--full">
      <a href="/legal/terms">Terms</a>
      <a href="/legal/privacy">Privacy</a>
      <a href="/legal/disclaimer">Disclaimer</a>
    </nav>
  </footer>

  <div class="menu-overlay" id="siteMenu" hidden>
    <div class="menu-panel">
      <nav class="menu-links">
        <a href="index.html" class="nav-calc">Calculator</a>
        <a href="medication-guides.html" class="nav-guides">Medication Guides</a>
        <a href="about.html" class="nav-about">About</a>
        <a href="donations.html" class="nav-support">Support</a>
        <a href="contact.html" class="nav-contact">Contact</a>
      </nav>
      <button class="close-menu" type="button">Close</button>
    </div>
  </div>

  <script src="global.js" defer></script>

</body>
</html>
