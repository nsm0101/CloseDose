<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" href="images/logo-teal.png">
  <style>
    :root {
      --teal-500: #1f8f7b;
      --teal-600: #123a37;
      --ink-900: #0f2c2a;
      --ink-700: #124643;
      --bg: #f5f9f9;
      --surface: rgba(255, 255, 255, 0.94);
      --surface-soft: rgba(235, 244, 249, 0.94);
      --card-border: 2px solid var(--ink-900);
      --inner-border: 1px dashed rgba(12, 44, 72, 0.18);
      --shadow-card: 0 14px 28px rgba(14, 58, 94, 0.2);
      --shadow-btn: 0 6px 0 rgba(15, 44, 42, 0.25);
      --muted: rgba(18, 70, 67, 0.75);
      --pill-bg: linear-gradient(160deg, rgba(255, 255, 255, 0.92), rgba(225, 243, 243, 0.98));
      --pill-border: 2px solid rgba(15, 44, 42, 0.28);
      --pill-hover: rgba(196, 229, 229, 0.6);
      --visit: #9fc8ff;
      --orders: #fba0e8;
      --note: #fef6b2;
      --dispo: #c2f3c5;
      --note-dim: #f3eecb;
      --timer-green: #e3f8ea;
      --timer-orange: #fff0da;
      --timer-red: #ffe0de;
      --danger: #e63946;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--ink-900);
      background: var(--bg) url('images/bg4k.png');
      background-size: cover;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
    }

    .wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 26px 14px 120px;
      gap: 18px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 14px 20px;
      width: min(900px, 100%);
      border-radius: 22px;
      border: 1px solid rgba(12, 44, 72, 0.12);
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.92), rgba(219, 239, 247, 0.85));
      box-shadow: 0 16px 30px rgba(13, 52, 82, 0.18);
      flex-wrap: wrap;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(1.6rem, 2vw + 1.1rem, 2.3rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      gap: 0.5ch;
      align-items: flex-end;
      color: var(--ink-900);
    }

    .brand-title strong {
      color: var(--teal-500);
      text-decoration: underline;
      text-decoration-thickness: 0.18em;
      text-underline-offset: 0.22em;
    }

    .page {
      width: min(1080px, 100%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px;
      background: var(--surface);
      border-radius: 24px;
      border: var(--card-border);
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }

    .page::after {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 18px;
      border: var(--inner-border);
      pointer-events: none;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 2.6vw, 2.2rem);
      letter-spacing: 0.02em;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .subhead {
      margin: 0;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.98rem;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button,
    select,
    input,
    textarea,
    label {
      font: inherit;
    }

    .pill-btn {
      background: var(--pill-bg);
      border: var(--pill-border);
      padding: 10px 16px;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      color: var(--ink-900);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      box-shadow: var(--shadow-btn);
    }

    .pill-btn:hover,
    .pill-btn:focus {
      transform: translateY(-1px);
      background-color: var(--pill-hover);
      outline: none;
    }

    .pill-btn.primary {
      background: linear-gradient(150deg, #e5fbf2, #e5f4ff);
      border-color: rgba(13, 143, 138, 0.35);
      color: var(--ink-900);
    }

    .pill-btn.danger {
      background: #fff5f6;
      border-color: rgba(230, 57, 70, 0.4);
      color: #b10f1f;
    }

    .patient-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    .patient-wrapper {
      position: relative;
    }

    .patient-card {
      position: relative;
      background: linear-gradient(180deg, var(--timer-tint, rgba(255, 255, 255, 0.85)), var(--surface-soft));
      border: var(--card-border);
      border-radius: 20px;
      padding: 0;
      box-shadow: 0 18px 32px rgba(15, 68, 109, 0.16);
      overflow: hidden;
    }

    .patient-card::before {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 16px;
      border: var(--inner-border);
      pointer-events: none;
    }

    .patient-card[open] {
      padding-bottom: 16px;
    }

    .card-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px 16px 20px;
      background: rgba(255, 255, 255, 0.7);
      border-bottom: 1px solid rgba(12, 44, 72, 0.08);
      cursor: pointer;
      list-style: none;
      position: relative;
      z-index: 2;
    }

    .note-toggle {
      position: absolute;
      top: 8px;
      right: 12px;
      border: 2px solid rgba(15, 31, 51, 0.2);
      background: var(--note-dim);
      border-radius: 12px;
      padding: 6px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 6px 12px rgba(15, 31, 51, 0.14);
    }

    .note-toggle span {
      display: block;
      width: 18px;
      height: 22px;
      background: linear-gradient(180deg, #fffbe0, #f5e9a5);
      border: 1px solid rgba(15, 31, 51, 0.18);
      border-radius: 4px;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.9);
      position: relative;
    }

    .note-toggle span::before,
    .note-toggle span::after {
      content: '';
      position: absolute;
      left: 3px;
      right: 3px;
      height: 2px;
      background: rgba(15, 31, 51, 0.25);
      border-radius: 2px;
    }

    .note-toggle span::before { top: 6px; }
    .note-toggle span::after { top: 12px; }

    .note-toggle.active {
      background: var(--note);
      border-color: rgba(180, 146, 18, 0.5);
      box-shadow: 0 10px 20px rgba(180, 146, 18, 0.25);
    }

    .note-toggle:hover,
    .note-toggle:focus-visible {
      transform: translateY(-1px);
      outline: none;
    }

    .card-summary::-webkit-details-marker { display: none; }

    .card-summary::after {
      content: '';
      flex: 0 0 auto;
      width: 12px;
      height: 12px;
      border-right: 2px solid var(--ink-700);
      border-bottom: 2px solid var(--ink-700);
      transform: rotate(45deg);
      transition: transform 0.2s ease;
      margin-left: auto;
    }

    .patient-card[open] .card-summary::after {
      transform: rotate(225deg);
    }

    .summary-left,
    .summary-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .summary-left {
      flex: 2;
    }

    .summary-right {
      flex: 1.5;
      justify-content: flex-end;
      text-align: right;
    }

    .summary-room {
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid rgba(12, 44, 72, 0.18);
      background: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    .summary-name {
      font-weight: 800;
      font-size: 1.05rem;
    }

    .summary-meta {
      color: var(--muted);
      font-weight: 600;
    }

    .summary-flags {
      font-weight: 700;
      font-size: 0.92rem;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .flag-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(15, 31, 51, 0.16);
      box-shadow: 0 2px 6px rgba(15, 31, 51, 0.08);
    }

    .summary-dispo {
      font-size: 0.9rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(31, 143, 123, 0.12);
      border: 1px dashed rgba(31, 143, 123, 0.4);
    }

    .summary-dispo[data-empty="true"] {
      opacity: 0.6;
      background: transparent;
      border-style: dotted;
    }

    .summary-time {
      font-family: 'Roboto Mono', 'SFMono-Regular', ui-monospace, monospace;
      font-size: 0.85rem;
      color: var(--ink-700);
    }

    .summary-notes {
      display: block;
      color: var(--ink-700);
      font-weight: 700;
      font-size: 0.9rem;
      margin-top: 4px;
      max-width: 520px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .patient-card[open] .patient-grid {
      margin-top: 10px;
      padding: 0 16px 0 16px;
    }

    .patient-grid {
      display: grid;
      grid-template-columns: minmax(140px, 160px) 1fr minmax(160px, 190px);
      gap: 12px;
      align-items: start;
    }

    .room-select {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
    }

    .room-select label {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--muted);
    }

    select,
    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(12, 44, 72, 0.18);
      background: #f8fbff;
      color: var(--ink-900);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    select:focus,
    input:focus,
    textarea:focus {
      outline: none;
      border-color: rgba(13, 143, 138, 0.5);
      box-shadow: 0 0 0 3px rgba(6, 156, 180, 0.2);
    }

    .patient-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      align-items: center;
    }

    .patient-info .field label {
      display: block;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .patient-info .field textarea {
      min-height: 78px;
      resize: vertical;
    }

    .status-panel {
      justify-self: flex-end;
      background: #f7fbff;
      border-radius: 16px;
      padding: 12px;
      border: 1px dashed rgba(12, 44, 72, 0.2);
      display: grid;
      gap: 10px;
      align-content: start;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .status-title {
      font-weight: 800;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-time {
      font-family: 'Roboto Mono', 'SFMono-Regular', ui-monospace, monospace;
      font-size: 0.95rem;
      color: var(--ink-900);
      background: #fff;
      border-radius: 10px;
      padding: 8px 10px;
      border: 1px dashed rgba(15, 31, 51, 0.12);
      text-align: center;
    }

    .checkbox-row,
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 2px solid rgba(15, 31, 51, 0.16);
      background: #f9fbfd;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      font-weight: 700;
      color: var(--ink-900);
    }

    .chip:hover,
    .chip:focus-within {
      transform: translateY(-1px);
      box-shadow: 0 6px 12px rgba(15, 31, 51, 0.12);
      border-color: rgba(13, 143, 138, 0.4);
    }

    .chip input {
      width: 16px;
      height: 16px;
      accent-color: var(--ink-900);
    }

    .chip.visit, .flag-pill.visit { background: var(--visit); }
    .chip.orders, .flag-pill.orders { background: var(--orders); }
    .chip.note, .flag-pill.note { background: var(--note); }
    .chip.dispo, .flag-pill.dispo { background: var(--dispo); }

    .dispo-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
    }

    .dispo-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 2px dashed rgba(15, 31, 51, 0.14);
      background: #f8fbff;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      font-weight: 700;
      color: var(--ink-900);
    }

    .dispo-pill input {
      width: 16px;
      height: 16px;
      accent-color: var(--ink-900);
      appearance: none;
      border: 2px solid rgba(15, 31, 51, 0.32);
      border-radius: 50%;
      display: grid;
      place-content: center;
      background: #fff;
      position: relative;
    }

    .dispo-pill input::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(15, 31, 51, 0.26);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .dispo-pill input:checked::after {
      background: var(--teal-500);
      transform: scale(1.1);
    }

    .dispo-pill.active {
      border-color: rgba(13, 143, 138, 0.6);
      background: linear-gradient(120deg, #e5fbf2, #e5f4ff);
      box-shadow: 0 8px 18px rgba(13, 143, 138, 0.18);
    }

    .add-card {
      border: 2px dashed rgba(15, 31, 51, 0.2);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.7);
      padding: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .muted {
      color: var(--muted);
      font-weight: 700;
      font-size: 0.94rem;
    }

    .timer-stack {
      margin-top: -14px;
      padding: 0 10px 8px 10px;
      display: grid;
      gap: 8px;
      width: 100%;
      max-width: 100%;
    }

    .timer-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px dashed rgba(12, 44, 72, 0.2);
      border-radius: 14px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 16px rgba(12, 44, 72, 0.12);
      width: 100%;
      max-width: 100%;
    }

    .timer-title {
      border: 1px solid rgba(12, 44, 72, 0.2);
      border-radius: 10px;
      padding: 8px 10px;
      font-weight: 700;
      background: #f7fbff;
    }

    .timer-display {
      font-family: 'Roboto Mono', 'SFMono-Regular', ui-monospace, monospace;
      font-weight: 800;
      color: var(--ink-900);
      min-width: 110px;
      text-align: right;
    }

    .timer-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
    }

    .timer-actions button {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 10px;
      border: 1px solid rgba(12, 44, 72, 0.18);
      background: #f3f8fb;
      cursor: pointer;
      font-weight: 900;
      font-size: 1.05rem;
      color: var(--ink-900);
      transition: transform 0.08s ease, box-shadow 0.18s ease, background-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .timer-actions .delete-btn {
      background: #fff5f6;
      border-color: rgba(230, 57, 70, 0.35);
      color: #c1121f;
    }

    .timer-actions button:hover,
    .timer-actions button:focus-visible {
      transform: translateY(-1px);
      outline: none;
      box-shadow: 0 8px 14px rgba(12, 44, 72, 0.14);
    }

    @media (max-width: 960px) {
      .page {
        padding: 16px 14px;
      }
    }

    @media (max-width: 860px) {
      .patient-grid {
        grid-template-columns: 1fr;
      }

      .status-panel {
        justify-self: stretch;
        order: 3;
      }
    }

    @media (max-width: 540px) {
      .wrap { padding: 16px 10px 100px; }

      .patient-info {
        grid-template-columns: 1fr;
      }

      textarea {
        min-height: 110px;
      }
    }

    @media (max-width: 640px) {
      .card-summary {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .summary-right {
        justify-content: space-between;
        width: 100%;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand-header">
      <h1 class="brand-title">Patient <strong>Manager</strong></h1>
      <p class="subhead">Borrowing CloseDose's look while keeping the quick-glance shift board feel.</p>
    </div>

    <div class="page">
      <header>
        <div>
          <h1>Patient Manager</h1>
          <p class="subhead">Track active patients during shift—rooms, plans, and dispo at a glance.</p>
        </div>
        <div class="controls">
          <button class="pill-btn danger" id="clear-list">Clear List</button>
          <button class="pill-btn primary" id="add-patient">+ Add Patient</button>
        </div>
      </header>

      <div class="patient-list" id="patient-list"></div>

      <div class="add-card">
        <button class="pill-btn primary" id="add-patient-bottom" aria-label="Add another patient">+</button>
      </div>
    </div>
  </div>

  <template id="patient-template">
    <div class="patient-wrapper">
      <details class="patient-card" open>
        <summary class="card-summary" aria-label="Toggle condensed patient view">
          <button class="note-toggle" type="button" aria-label="Mark note priority"><span aria-hidden="true"></span></button>
          <div class="summary-left">
            <span class="summary-room" data-summary-room>--</span>
            <span class="summary-name" data-summary-name>New patient</span>
            <span class="summary-meta" data-summary-meta>Age · Gender</span>
            <span class="summary-notes" data-summary-notes></span>
          </div>
          <div class="summary-right">
            <span class="summary-flags" data-summary-flags>Waiting for updates</span>
            <span class="summary-dispo" data-summary-dispo data-empty="true">No dispo</span>
            <span class="summary-time" data-summary-time>--:--:--</span>
          </div>
        </summary>
        <div class="patient-grid">
          <div class="room-select">
            <label>Room</label>
            <select class="room-field"></select>
          </div>

          <div class="patient-info">
            <div class="field">
              <label for="initials">Initials</label>
              <input type="text" class="initials-field" placeholder="e.g., J.D." maxlength="12" />
            </div>
            <div class="field">
              <label for="age">Age</label>
              <input type="number" class="age-field" min="0" max="120" placeholder="yrs" />
            </div>
            <div class="field">
              <label for="gender">Gender</label>
              <select class="gender-field">
                <option value="">–</option>
                <option value="female">♀ Female</option>
                <option value="male">♂ Male</option>
                <option value="other">∅ Other</option>
              </select>
            </div>
            <div class="field" style="grid-column: 1 / -1;">
              <label for="notes">Pertinent info</label>
              <textarea class="notes-field" placeholder="Presentation, plan, follow-ups..."></textarea>
            </div>
            <div class="field" style="grid-column: 1 / -1;">
              <div class="chip-row">
                <label class="chip visit">
                  <input type="checkbox" class="seen-field" />
                  Visit
                </label>
                <label class="chip orders">
                  <input type="checkbox" class="labs-field" />
                  Orders
                </label>
                <label class="chip note">
                  <input type="checkbox" class="meds-field" />
                  Meds Ordered
                </label>
              </div>
            </div>
            <div class="field" style="grid-column: 1 / -1;">
              <div class="muted">Dispo decision</div>
              <div class="dispo-options">
                <label class="dispo-pill">
                  <input type="radio" name="dispo" value="floor" />
                  Admit Floor
                </label>
                <label class="dispo-pill">
                  <input type="radio" name="dispo" value="picu" />
                  Admit PICU
                </label>
                <label class="dispo-pill">
                  <input type="radio" name="dispo" value="discharge" />
                  Discharge
                </label>
                <label class="dispo-pill">
                  <input type="radio" name="dispo" value="transfer" />
                  Transfer
                </label>
                <label class="dispo-pill">
                  <input type="radio" name="dispo" value="ed_observation" />
                  ED Observation
                </label>
                <label class="dispo-pill">
                  <input type="radio" name="dispo" value="cdu" />
                  CDU
                </label>
              </div>
            </div>
          </div>

          <div class="status-panel">
            <div class="status-title">Reassess Timer</div>
            <div class="status-time" data-time>--:--:--</div>
          </div>
        </div>
      </details>
      <div class="timer-stack" data-timer-stack></div>
    </div>
  </template>

  <script>
    const roomOptions = [
      'A1', 'A2', 'A3', 'A4', 'A5', 'A6', 'A7', 'A8', 'A9', 'A10', 'A11', 'A12', 'A13',
      'B14', 'B15', 'B16', 'B17', 'B18', 'B19', 'B20', 'B21', 'B22', 'B23', 'B24',
      'V25', 'V26', 'V27', 'V28', 'V29', 'V30', 'V31', 'APACE-50', 'APACE-51', 'BPACE-52', 'PACE-53',
      'OV-A', 'OV-B', 'OV-C', 'OV-D', 'OV-E', 'OV-F', 'OV-G'
    ];

    const listEl = document.getElementById('patient-list');
    const addBtns = [document.getElementById('add-patient'), document.getElementById('add-patient-bottom')];
    const clearBtn = document.getElementById('clear-list');
    const template = document.getElementById('patient-template');
    const STORAGE_KEY = 'patient-manager-list';
    // Shared document hosted by jsonstorage.net so every device sees the same board.
    const REMOTE_ENDPOINT = 'https://jsonstorage.net/api/items/b4f278c7-6c45-4a87-9c41-0baa0ed1c9c7';
    const REMOTE_POLL_INTERVAL = 15000;
    const REMOTE_SAVE_DEBOUNCE = 600;

    const genderSymbols = {
      female: '♀',
      male: '♂',
      other: '∅',
    };

    const dispoLabels = {
      floor: 'Admit Floor',
      picu: 'Admit PICU',
      discharge: 'Discharge',
      transfer: 'Transfer',
      ed_observation: 'ED Observation',
      cdu: 'CDU',
    };

    let patients = [];
    let remoteSaveHandle = null;
    let isApplyingRemote = false;

    function persistLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(patients));
    }

    function queueRemotePersist() {
      persistLocal();
      if (!REMOTE_ENDPOINT) return;
      if (remoteSaveHandle) {
        clearTimeout(remoteSaveHandle);
      }
      remoteSaveHandle = setTimeout(() => {
        remoteSaveHandle = null;
        syncRemote();
      }, REMOTE_SAVE_DEBOUNCE);
    }

    function load() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        patients = stored ? JSON.parse(stored) : [];
      } catch (err) {
        patients = [];
      }
      patients = patients.map(normalizePatient);
    }

    function formattedElapsed(timestamp) {
      if (!timestamp) return '--:--:--';
      const diff = Math.max(0, Date.now() - timestamp);
      const hours = Math.floor(diff / 1000 / 3600).toString().padStart(2, '0');
      const mins = Math.floor((diff / 1000 / 60) % 60).toString().padStart(2, '0');
      const secs = Math.floor((diff / 1000) % 60).toString().padStart(2, '0');
      return `${hours}:${mins}:${secs}`;
    }

    function formatDuration(ms = 0) {
      const safe = Math.max(0, ms);
      const hours = Math.floor(safe / 1000 / 3600).toString().padStart(2, '0');
      const mins = Math.floor((safe / 1000 / 60) % 60).toString().padStart(2, '0');
      const secs = Math.floor((safe / 1000) % 60).toString().padStart(2, '0');
      return `${hours}:${mins}:${secs}`;
    }

    function normalizePatient(patient = {}) {
      const fallbackId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      return {
        id: patient.id || fallbackId,
        room: patient.room || '',
        initials: typeof patient.initials === 'string' ? patient.initials : '',
        age: typeof patient.age === 'number' || typeof patient.age === 'string' ? patient.age : '',
        gender: typeof patient.gender === 'string' ? patient.gender : '',
        notes: typeof patient.notes === 'string' ? patient.notes : '',
        seen: Boolean(patient.seen),
        labsOrdered: Boolean(patient.labsOrdered),
        medsOrdered: Boolean(patient.medsOrdered),
        dispo: typeof patient.dispo === 'string' ? patient.dispo : '',
        updatedAt: typeof patient.updatedAt === 'number' ? patient.updatedAt : Date.now(),
        reassessStartedAt: typeof patient.reassessStartedAt === 'number' ? patient.reassessStartedAt : (typeof patient.updatedAt === 'number' ? patient.updatedAt : Date.now()),
        notePinned: Boolean(patient.notePinned),
        timers: Array.isArray(patient.timers)
          ? patient.timers.map((timer) => ({
            id: timer.id || (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`),
            title: typeof timer.title === 'string' ? timer.title : 'Timer',
            startedAt: typeof timer.startedAt === 'number' ? timer.startedAt : Date.now(),
            accumulated: typeof timer.accumulated === 'number' ? timer.accumulated : 0,
            pausedAt: typeof timer.pausedAt === 'number' ? timer.pausedAt : null,
            paused: Boolean(timer.paused),
          }))
          : [],
      };
    }

    function sortPatientsInPlace() {
      patients.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    }

    function mergePatientLists(localList, remoteList) {
      const map = new Map();
      localList.forEach((patient) => {
        const normalized = normalizePatient(patient);
        map.set(normalized.id, normalized);
      });
      remoteList.forEach((patient) => {
        const normalized = normalizePatient(patient);
        const existing = map.get(normalized.id);
        if (!existing || normalized.updatedAt > existing.updatedAt) {
          map.set(normalized.id, normalized);
        }
      });
      return Array.from(map.values()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    }

    async function syncRemote() {
      if (!REMOTE_ENDPOINT) return;
      try {
        await fetch(REMOTE_ENDPOINT, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patients),
        });
      } catch (error) {
        console.warn('Unable to sync shared list', error);
      }
    }

    async function hydrateFromRemote() {
      if (!REMOTE_ENDPOINT) return;
      if (isApplyingRemote) return;
      try {
        const response = await fetch(`${REMOTE_ENDPOINT}?t=${Date.now()}`, { cache: 'no-store' });
        if (response.status === 404) return;
        if (!response.ok) throw new Error('Unable to fetch shared list');
        const data = await response.json();
        if (!Array.isArray(data)) return;
        const merged = mergePatientLists(patients, data);
        if (JSON.stringify(merged) === JSON.stringify(patients)) return;
        isApplyingRemote = true;
        patients = merged;
        persistLocal();
        renderAll();
      } catch (error) {
        console.warn('Unable to refresh shared list', error);
      } finally {
        isApplyingRemote = false;
      }
    }

    function timerTint(elapsedMs) {
      const target = 2 * 60 * 60 * 1000;
      const ratio = Math.min(1, elapsedMs / target);
      if (ratio < 0.5) {
        return '--timer-green';
      }
      if (ratio < 0.85) {
        return '--timer-orange';
      }
      return '--timer-red';
    }

    function computeTimerElapsed(timer) {
      if (!timer) return 0;
      if (timer.paused) return timer.accumulated;
      return timer.accumulated + Math.max(0, Date.now() - (timer.startedAt || Date.now()));
    }

    function updateTimers() {
      document.querySelectorAll('.patient-wrapper').forEach((wrapper) => {
        const id = wrapper.dataset.id;
        const patient = patients.find((p) => p.id === id);
        const reassessElapsed = patient ? Math.max(0, Date.now() - (patient.reassessStartedAt || patient.updatedAt)) : 0;
        const timeText = formattedElapsed(patient?.reassessStartedAt);
        const card = wrapper.querySelector('.patient-card');
        const timeEl = wrapper.querySelector('[data-time]');
        const summaryTimeEl = wrapper.querySelector('[data-summary-time]');
        if (timeEl) timeEl.textContent = timeText;
        if (summaryTimeEl) summaryTimeEl.textContent = timeText;
        if (card) card.style.setProperty('--timer-tint', `var(${timerTint(reassessElapsed)})`);

        const stack = wrapper.querySelector('[data-timer-stack]');
        if (stack && patient?.timers) {
          patient.timers.forEach((timer) => {
            const row = stack.querySelector(`[data-timer-id="${timer.id}"]`);
            const display = row?.querySelector('[data-timer-display]');
            if (display) display.textContent = formatDuration(computeTimerElapsed(timer));
            const pauseBtn = row?.querySelector('[data-timer-pause]');
            if (pauseBtn) {
              pauseBtn.textContent = '‖';
              pauseBtn.setAttribute('aria-label', timer.paused ? 'Resume timer' : 'Pause timer');
            }
          });
        }
      });
    }

    function populateCardSummary(wrapper, patient) {
      if (!wrapper) return;
      const roomEl = wrapper.querySelector('[data-summary-room]');
      const nameEl = wrapper.querySelector('[data-summary-name]');
      const metaEl = wrapper.querySelector('[data-summary-meta]');
      const flagsEl = wrapper.querySelector('[data-summary-flags]');
      const dispoEl = wrapper.querySelector('[data-summary-dispo]');
      const notesEl = wrapper.querySelector('[data-summary-notes]');

      if (roomEl) roomEl.textContent = patient.room || '--';
      if (nameEl) nameEl.textContent = patient.initials || 'New patient';

      if (metaEl) {
        const metaBits = [];
        if (patient.age !== '' && patient.age !== null && patient.age !== undefined) {
          metaBits.push(`${patient.age} yrs`);
        }
        const genderSymbol = genderSymbols[patient.gender];
        if (genderSymbol) metaBits.push(genderSymbol);
        else if (patient.gender) metaBits.push(patient.gender);
        metaEl.textContent = metaBits.length ? metaBits.join(' · ') : 'Details pending';
      }

      if (flagsEl) {
        const flags = [];
        if (patient.seen) flags.push({ text: 'Visit', className: 'visit' });
        if (patient.labsOrdered) flags.push({ text: 'Orders', className: 'orders' });
        if (patient.medsOrdered) flags.push({ text: 'Meds ordered', className: 'note' });
        if (flags.length) {
          flagsEl.innerHTML = '';
          flags.forEach((flag) => {
            const pill = document.createElement('span');
            pill.className = `flag-pill ${flag.className}`;
            pill.textContent = flag.text;
            flagsEl.appendChild(pill);
          });
        } else {
          flagsEl.textContent = 'No tasks marked';
        }
      }

      if (dispoEl) {
        if (patient.dispo) {
          dispoEl.textContent = dispoLabels[patient.dispo] || patient.dispo;
          dispoEl.dataset.empty = 'false';
        } else {
          dispoEl.textContent = 'No dispo';
          dispoEl.dataset.empty = 'true';
        }
      }

      if (notesEl) {
        if (patient.notes?.trim()) {
          notesEl.textContent = patient.notes.trim();
          notesEl.style.display = 'block';
        } else {
          notesEl.textContent = '';
          notesEl.style.display = 'none';
        }
      }

      const summaryTimeEl = wrapper.querySelector('[data-summary-time]');
      if (summaryTimeEl) summaryTimeEl.textContent = formattedElapsed(patient.reassessStartedAt);
    }

    function updateSummaryForPatient(patient) {
      if (!patient) return;
      const wrapper = document.querySelector(`.patient-wrapper[data-id="${patient.id}"]`);
      populateCardSummary(wrapper, patient);
    }

    function createRoomOptions(selectEl, value = '') {
      selectEl.innerHTML = '<option value="">Select room</option>' + roomOptions.map((room) => `<option value="${room}">${room}</option>`).join('');
      selectEl.value = value;
    }

    function markDispoSelections(container, value) {
      container.querySelectorAll('.dispo-pill').forEach((pill) => {
        const input = pill.querySelector('input');
        input.checked = input.value === value;
        pill.classList.toggle('active', input.checked);
        input.dataset.wasChecked = input.checked ? 'true' : 'false';
      });
    }

    function handleChange(id, updater, options = {}) {
      const idx = patients.findIndex((p) => p.id === id);
      if (idx === -1) return;
      const now = Date.now();
      patients[idx] = {
        ...patients[idx],
        ...updater,
        updatedAt: options.skipUpdateStamp ? patients[idx].updatedAt : now,
        reassessStartedAt: options.touchReassess ? now : patients[idx].reassessStartedAt,
      };
      sortPatientsInPlace();
      updateSummaryForPatient(patients[idx]);
      queueRemotePersist();
      updateTimers();
    }

    function renderPatientTimers(patient, stackEl) {
      if (!stackEl) return;
      stackEl.innerHTML = '';
      patient.timers.forEach((timer, idx) => {
        const row = document.createElement('div');
        row.className = 'timer-card';
        row.dataset.timerId = timer.id;

        const title = document.createElement('input');
        title.className = 'timer-title';
        title.value = timer.title || `Timer ${idx + 1}`;
        title.addEventListener('input', (e) => {
          const current = patients.find((p) => p.id === patient.id) || patient;
          handleChange(patient.id, {
            timers: current.timers.map((t) => (t.id === timer.id ? { ...t, title: e.target.value } : t)),
          }, { skipUpdateStamp: true });
        });

        const display = document.createElement('div');
        display.className = 'timer-display';
        display.dataset.timerDisplay = 'true';
        display.textContent = formatDuration(computeTimerElapsed(timer));

        const actions = document.createElement('div');
        actions.className = 'timer-actions';

        const pauseBtn = document.createElement('button');
        pauseBtn.dataset.timerPause = 'true';
        pauseBtn.className = 'pause-btn';
        pauseBtn.textContent = '‖';
        pauseBtn.setAttribute('aria-label', timer.paused ? 'Resume timer' : 'Pause timer');
        pauseBtn.addEventListener('click', () => {
          const current = patients.find((p) => p.id === patient.id) || patient;
          const nextTimers = current.timers.map((t) => {
            if (t.id !== timer.id) return t;
            if (t.paused) {
              const now = Date.now();
              return { ...t, paused: false, pausedAt: null, startedAt: now };
            }
            return { ...t, paused: true, pausedAt: Date.now(), accumulated: computeTimerElapsed(t) };
          });
          handleChange(patient.id, { timers: nextTimers }, { skipUpdateStamp: true });
        });

        const resetBtn = document.createElement('button');
        resetBtn.className = 'reset-btn';
        resetBtn.textContent = '↺';
        resetBtn.setAttribute('aria-label', 'Reset timer');
        resetBtn.addEventListener('click', () => {
          const now = Date.now();
          const current = patients.find((p) => p.id === patient.id) || patient;
          const nextTimers = current.timers.map((t) => (t.id === timer.id ? { 
            ...t,
            startedAt: now,
            accumulated: 0,
            pausedAt: null,
            paused: false,
          } : t));
          handleChange(patient.id, { timers: nextTimers }, { skipUpdateStamp: true });
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '✕';
        deleteBtn.setAttribute('aria-label', 'Delete timer');
        deleteBtn.addEventListener('click', () => {
          const current = patients.find((p) => p.id === patient.id) || patient;
          const nextTimers = current.timers.filter((t) => t.id !== timer.id);
          handleChange(patient.id, { timers: nextTimers }, { skipUpdateStamp: true });
        });

        actions.append(pauseBtn, resetBtn, deleteBtn);
        row.append(title, display, actions);
        stackEl.appendChild(row);
      });
    }

    function addTimer(patientId) {
      const idx = patients.findIndex((p) => p.id === patientId);
      if (idx === -1) return;
      if (patients[idx].timers.length >= 5) return;
      const now = Date.now();
      const newTimer = {
        id: crypto.randomUUID ? crypto.randomUUID() : `${now}-${Math.random().toString(16).slice(2)}`,
        title: `Timer ${patients[idx].timers.length + 1}`,
        startedAt: now,
        accumulated: 0,
        pausedAt: null,
        paused: false,
      };
      patients[idx] = { ...patients[idx], timers: [...patients[idx].timers, newTimer] };
      renderAll();
      queueRemotePersist();
    }

    function renderPatient(patient) {
      const wrapper = template.content.firstElementChild.cloneNode(true);
      const card = wrapper.querySelector('.patient-card');
      wrapper.dataset.id = patient.id;
      card.dataset.id = patient.id;

      const roomField = wrapper.querySelector('.room-field');
      const initialsField = wrapper.querySelector('.initials-field');
      const ageField = wrapper.querySelector('.age-field');
      const genderField = wrapper.querySelector('.gender-field');
      const notesField = wrapper.querySelector('.notes-field');
      const seenField = wrapper.querySelector('.seen-field');
      const labsField = wrapper.querySelector('.labs-field');
      const medsField = wrapper.querySelector('.meds-field');
      const dispoContainer = wrapper.querySelector('.dispo-options');
      const noteToggle = wrapper.querySelector('.note-toggle');
      const timerStack = wrapper.querySelector('[data-timer-stack]');

      createRoomOptions(roomField, patient.room || '');
      initialsField.value = patient.initials || '';
      ageField.value = patient.age || '';
      genderField.value = patient.gender || '';
      notesField.value = patient.notes || '';
      seenField.checked = Boolean(patient.seen);
      labsField.checked = Boolean(patient.labsOrdered);
      medsField.checked = Boolean(patient.medsOrdered);
      markDispoSelections(dispoContainer, patient.dispo || '');
      noteToggle.classList.toggle('active', patient.notePinned);

      roomField.addEventListener('change', (e) => handleChange(patient.id, { room: e.target.value }));
      initialsField.addEventListener('input', (e) => handleChange(patient.id, { initials: e.target.value }));
      ageField.addEventListener('input', (e) => handleChange(patient.id, { age: e.target.value }));
      genderField.addEventListener('change', (e) => handleChange(patient.id, { gender: e.target.value }));
      notesField.addEventListener('input', (e) => handleChange(patient.id, { notes: e.target.value }, { skipUpdateStamp: true }));
      seenField.addEventListener('change', (e) => handleChange(patient.id, { seen: e.target.checked }, { skipUpdateStamp: true }));
      labsField.addEventListener('change', (e) => handleChange(patient.id, { labsOrdered: e.target.checked }, { skipUpdateStamp: true }));
      medsField.addEventListener('change', (e) => handleChange(patient.id, { medsOrdered: e.target.checked }, { skipUpdateStamp: true }));

      noteToggle.addEventListener('click', (event) => {
        event.stopPropagation();
        const current = patients.find((p) => p.id === patient.id) || patient;
        const next = !current.notePinned;
        noteToggle.classList.toggle('active', next);
        handleChange(patient.id, { notePinned: next }, { skipUpdateStamp: true });
      });

      dispoContainer.querySelectorAll('input[type="radio"]').forEach((radio) => {
        radio.name = `dispo-${patient.id}`;
        const captureState = () => {
          radio.dataset.wasChecked = radio.checked ? 'true' : 'false';
        };
        if (typeof window !== 'undefined' && 'PointerEvent' in window) {
          radio.addEventListener('pointerdown', captureState);
        } else {
          radio.addEventListener('mousedown', captureState);
          radio.addEventListener('touchstart', captureState);
        }
        radio.addEventListener('click', (e) => {
          if (radio.dataset.wasChecked === 'true') {
            e.preventDefault();
            radio.checked = false;
            markDispoSelections(dispoContainer, '');
            handleChange(patient.id, { dispo: '' }, { skipUpdateStamp: true });
          } else {
            markDispoSelections(dispoContainer, radio.value);
            handleChange(patient.id, { dispo: radio.value }, { skipUpdateStamp: true });
          }
        });
      });

      card.querySelector('[data-time]').textContent = formattedElapsed(patient.reassessStartedAt);
      populateCardSummary(wrapper, patient);
      renderPatientTimers(patient, timerStack);

      let lastTap = 0;
      card.addEventListener('pointerdown', (e) => {
        const now = Date.now();
        if (now - lastTap < 350) {
          e.preventDefault();
          handleChange(patient.id, {}, { touchReassess: true });
        }
        lastTap = now;
      });

      let startX = null;
      let startY = null;
      card.addEventListener('pointerdown', (e) => {
        startX = e.clientX;
        startY = e.clientY;
      });
      card.addEventListener('pointerup', (e) => {
        if (startX === null || startY === null) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (dx < -50 && Math.abs(dy) < 30) {
          addTimer(patient.id);
        }
        startX = null;
        startY = null;
      });

      return wrapper;
    }

    function renderAll() {
      listEl.innerHTML = '';
      patients.forEach((patient) => {
        listEl.appendChild(renderPatient(patient));
      });
      updateTimers();
    }

    function addPatient() {
      const now = Date.now();
      const newPatient = normalizePatient({ id: crypto.randomUUID ? crypto.randomUUID() : `${now}-${Math.random().toString(16).slice(2)}`, updatedAt: now, reassessStartedAt: now });
      patients.unshift(newPatient);
      sortPatientsInPlace();
      queueRemotePersist();
      renderAll();
    }

    addBtns.forEach((btn) => btn.addEventListener('click', addPatient));

    clearBtn.addEventListener('click', () => {
      const confirmClear = confirm('Clear the entire patient list? This cannot be undone.');
      if (!confirmClear) return;
      patients = [];
      queueRemotePersist();
      renderAll();
    });

    load();
    sortPatientsInPlace();
    renderAll();
    updateTimers();
    hydrateFromRemote();
    setInterval(updateTimers, 1000);
    setInterval(hydrateFromRemote, REMOTE_POLL_INTERVAL);
  </script>
</body>
</html>
